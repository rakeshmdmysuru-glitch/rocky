
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Academic Activities</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

table#activity-table th.description,
table#activity-table td.description {
    width: 55%;
    word-wrap: break-word;
}

table#activity-table th,
table#activity-table td {
    vertical-align: top;
}

.profile-photo{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #ddd;
}

.card{
    border:none;
    border-radius:12px;
}

</style>
</head>

<body class="p-4">

<div class="container">

   

   <!-- BIOGRAPHY SECTION -->

<div class="card shadow-sm mb-4">

    <div class="card-body">

        <div class="row align-items-center">

            <!-- PHOTO -->

            <div class="col-md-3 text-center">

                <img
                    id="profilePhoto"
                    class="profile-photo"
                    alt="Profile Photo"
                    referrerpolicy="no-referrer"
                >

            </div>


            <!-- PROFILE DETAILS -->

            <div class="col-md-9">

                <h2 id="profileName">
                    Prof. Rakesh M D
                </h2>

                <h5
                    id="profileDesignation"
                    class="text-muted"
                >
                    Assistant Professor
                </h5>


                <!-- BIO -->

                <p
                    id="profileBio"
                    class="mt-3"
                >
                    Loading biography...
                </p>


                <!-- DYNAMIC SUMMARY -->

                <div class="card bg-light border-0 mt-3">

                    <div class="card-body">

                        <h5 class="mb-2">
                            Brief Academic Summary
                        </h5>

                        <p
                            id="dynamicSummary"
                            class="mb-0"
                        >
                            Loading summary...
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

    <!-- TITLE -->

    <h2 class="mb-4">
        Academic Activities
    </h2>


    <!-- FILTERS -->

    <div class="row mb-3 g-2">

        <div class="col-md-3">

            <select id="typeFilter" class="form-select">
                <option value="">All Types</option>
            </select>

        </div>

        <div class="col-md-3">

            <select id="yearFilter" class="form-select">
                <option value="">All Years</option>
            </select>

        </div>

        <div class="col-md-6">

            <input
                type="text"
                id="searchFilter"
                class="form-control"
                placeholder="Search Description"
            >

        </div>

    </div>


    <!-- STATISTICS TABLE -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h4 class="mb-3">
                Activity Statistics
            </h4>

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead class="table-dark">

                        <tr>
                            <th>Type</th>
                            <th>Count</th>
                        </tr>

                    </thead>

                    <tbody id="statsTableBody"></tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- MAIN TABLE -->

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table
                    id="activity-table"
                    class="table table-bordered table-hover table-striped"
                >

                    <thead class="table-dark">

                        <tr>

                            <th style="width:5%;">
                                Sl No
                            </th>

                            <th style="width:15%;">
                                Date
                            </th>

                            <th style="width:15%;">
                                Type
                            </th>

                            <th class="description">
                                Description
                            </th>

                        </tr>

                    </thead>

                    <tbody></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQuqqWiO_Inm0kKaFXpskmLv8DtSvBM61iO_SKX8HdqYEBBWGASGeNMJfG6rFJFpQ/pub?output=csv";

let tableData = [];

const tbody = document.querySelector("#activity-table tbody");

const statsTableBody =
document.getElementById("statsTableBody");

const typeFilter =
document.getElementById("typeFilter");

const yearFilter =
document.getElementById("yearFilter");

const searchFilter =
document.getElementById("searchFilter");


// ================= LOAD CSV =================

fetch(csvUrl)

.then(res => res.text())

.then(csvText => {

    const parsed = Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true
    });

    tableData = parsed.data.map(row => {

        const rawDate =
            (row["Date"] || "").trim();

        let year = "";

        // Extract year safely

        const parts = rawDate.split("/");

        if(parts.length === 3){
            year = parts[2].trim();
        }

        // FIXED DESCRIPTION

        const description =
            row["Description"] ||
            Object.values(row).slice(3).join(" ");

        return {

            sl:
                row["Sl No"] || "",

            date:
                rawDate,

            type:
                row["Type"] || "",

            description:
                description || "",

            year:
                year

        };

    });

    populateTypeFilter();

    populateYearFilter();

    loadBiography();

    renderTable();

})

.catch(err => {

    console.error("CSV Loading Error:", err);

});


// ================= BIOGRAPHY =================

function loadBiography(){

    document.getElementById("profileName").innerText =
        "Prof. Rakesh M D";

    document.getElementById("profileDesignation").innerText =
        "Assistant Professor, Department of Electronics and Communication Engineering, SJCE, JSS Science and Technology University, Mysuru";

    // GOOGLE DRIVE PHOTO

    document.getElementById("profilePhoto").src =
        "https://drive.google.com/thumbnail?id=1m4NIl6m2Ex7KR1BJCh2nDTuvmytBTZCh&sz=w1000";


    // ===== AI STYLE BIO GENERATION =====

    const totalActivities =
        tableData.length;

    const counts = {};

    const years = [];

    tableData.forEach(row => {

        const type =
            row.type.trim();

        if(!counts[type]){
            counts[type] = 0;
        }

        counts[type]++;

        if(row.year){
            years.push(parseInt(row.year));
        }

    });

    const latestYear =
        Math.max(...years);

    const earliestYear =
        Math.min(...years);

    const journalCount =
        counts["Journal"] || 0;

    const conferenceCount =
        counts["Conference"] || 0;

    const workshopCount =
        counts["Workshop"] || 0;

    const fdpCount =
        counts["FDP"] || 0;

    // DYNAMIC AI-LIKE BIO

    let bioText = `

        Prof. Rakesh M D is actively engaged in academic,
        research, and professional development activities
        in the field of Electronics and Communication Engineering.

        With ${totalActivities} documented academic contributions
        between ${earliestYear} and ${latestYear},

        the profile includes
        ${journalCount} journal publications,
        ${conferenceCount} conference activities,
        ${workshopCount} workshops,
        and ${fdpCount} Faculty Development Programs.

        His academic interests include research dissemination,
        technical learning, collaborative activities,
        and continuous professional advancement.

    `;

    document.getElementById("profileBio").innerText =
        bioText.replace(/\s+/g, " ").trim();

}
function updateDynamicSummary(data){

    const total =
        data.length;

    const counts = {};

    data.forEach(row => {

        const type =
            row.type.trim();

        if(!counts[type]){
            counts[type] = 0;
        }

        counts[type]++;

    });

    let summaryText = "";

    if(total === 0){

        summaryText =
            "No academic activities found.";

    }
    else{

        summaryText =
            `A total of ${total} academic activities are available`;

        const parts = [];

        Object.keys(counts)

        .sort()

        .forEach(type => {

            parts.push(
                `${counts[type]} ${type}`
            );

        });

        summaryText +=
            ", including " +
            parts.join(", ") +
            ".";

    }

    document.getElementById(
        "dynamicSummary"
    ).innerText = summaryText;

}

// ================= FILTERS =================

function populateTypeFilter(){

    const types =
        [...new Set(tableData.map(r => r.type))]
        .sort();

    types.forEach(type => {

        if(type){

            const option =
                document.createElement("option");

            option.value = type;

            option.textContent = type;

            typeFilter.appendChild(option);

        }

    });

}


function populateYearFilter(){

    const years =
        [...new Set(tableData.map(r => r.year))]
        .sort((a,b)=>b-a);

    years.forEach(year => {

        if(year){

            const option =
                document.createElement("option");

            option.value = year;

            option.textContent = year;

            yearFilter.appendChild(option);

        }

    });

}


// ================= GET FILTERED DATA =================

function getFilteredData(){

    const typeVal =
        typeFilter.value.toLowerCase();

    const yearVal =
        yearFilter.value;

    const searchVal =
        searchFilter.value.toLowerCase();

    return tableData.filter(row => {

        return (

            (typeVal === "" ||
            row.type.toLowerCase() === typeVal)

            &&

            (yearVal === "" ||
            row.year === yearVal)

            &&

            (searchVal === "" ||
            row.description.toLowerCase()
            .includes(searchVal))

        );

    });

}


// ================= RENDER TABLE =================

function renderTable(){

    const filteredData =
        getFilteredData();

    tbody.innerHTML = "";

    filteredData.forEach(row => {

        const tr =
            document.createElement("tr");

        tr.innerHTML = `

            <td>${row.sl}</td>

            <td>${row.date}</td>

            <td>${row.type}</td>

            <td class="description">
                ${row.description}
            </td>

        `;

        tbody.appendChild(tr);

    });

    renderStatistics(filteredData);
    updateDynamicSummary(filteredData);

}


// ================= RENDER STATISTICS =================

function renderStatistics(data){

    statsTableBody.innerHTML = "";

    const counts = {};

    data.forEach(row => {

        const type =
            row.type.trim();

        if(!counts[type]){
            counts[type] = 0;
        }

        counts[type]++;

    });

    Object.keys(counts)

    .sort()

    .forEach(type => {

        statsTableBody.innerHTML += `

            <tr>

                <td>${type}</td>

                <td>${counts[type]}</td>

            </tr>

        `;

    });

}


// ================= EVENTS =================

typeFilter.addEventListener(
    "change",
    renderTable
);

yearFilter.addEventListener(
    "change",
    renderTable
);

searchFilter.addEventListener(
    "input",
    renderTable
);

</script>

</body>
</html>
```
